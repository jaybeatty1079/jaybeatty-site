<!doctype html><meta charset="utf-8"><title>asset contact sheet</title><style>body{margin:0;background:#edeeea;font:12px/1.3 ui-monospace,Menlo,monospace;color:#1e2226}#g{display:grid;grid-template-columns:repeat(6,1fr)}#g div{aspect-ratio:1;position:relative;border:1px solid #c9cdc6}#g canvas{width:100%;height:100%;display:block}#g span{position:absolute;left:4px;bottom:4px;background:#fff;padding:1px 4px}</style>
<div id="g"></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const cat=await (await fetch('models/_catalog.json')).json();const g=document.getElementById('g');window.done=0;
for(const c of cat){const d=document.createElement('div');const cv=document.createElement('canvas');d.appendChild(cv);const s=document.createElement('span');s.textContent=c.term+' · '+c.license;d.appendChild(s);g.appendChild(d);
  const r=new THREE.WebGLRenderer({canvas:cv,antialias:true});r.setSize(220,220,false);const sc=new THREE.Scene();sc.background=new THREE.Color('#edeeea');sc.add(new THREE.HemisphereLight(0xffffff,0x777777,1.3));const dl=new THREE.DirectionalLight(0xffffff,1);dl.position.set(3,5,4);sc.add(dl);
  const cam=new THREE.PerspectiveCamera(40,1,.01,2000);
  new GLTFLoader().load(c.file,gl=>{const o=gl.scene;sc.add(o);const b=new THREE.Box3().setFromObject(o);const sz=b.getSize(new THREE.Vector3()),ce=b.getCenter(new THREE.Vector3());const m=Math.max(sz.x,sz.y,sz.z);cam.position.set(ce.x+m*.9,ce.y+m*.7,ce.z+m*1.1);cam.lookAt(ce);r.render(sc,cam);window.done++},undefined,e=>{s.textContent+=' · failed';window.done++})}
</script>

# Netlify builds jaybeatty.com from this repo on every push to main (15 credits a push on the Free plan: batch changes).
# dist/ is the site folder plus the headers and redirects. The four tools live on GitHub Pages (https://jaybeatty1079.github.io/tools/) and redirect there.
[build]
  command = "rm -rf dist && cp -R site/. dist/ && cp netlify/_headers netlify/_redirects dist/"
  publish = "dist"

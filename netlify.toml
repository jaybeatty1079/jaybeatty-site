# Netlify builds jaybeatty.com from this repo on every push to main.
# It assembles the live site into dist/: the site folder plus the TEAM calculator pages.
[build]
  command = "rm -rf dist && mkdir -p dist/team-calculator/docs && cp -R site/. dist/ && cp team-calculator/index.html dist/team-calculator/ && cp team-calculator/docs/decisions.html dist/team-calculator/docs/ && cp netlify/_headers netlify/_redirects dist/"
  publish = "dist"
